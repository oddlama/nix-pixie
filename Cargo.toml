[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The agent parses untrusted network input, so it must not panic: forbid
# every way of panicking we can lint for. Test files allow them again.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

# iroh 1.4.1 drops IPv6 scope ids, which breaks link-local connections
# (https://github.com/n0-computer/iroh/issues/4584). The fork adds the fix
# (and a dream2nix workaround); drop this once upstream releases it.
[patch.crates-io]
iroh = { git = "https://github.com/oddlama/iroh", branch = "nix-pixie-link-local" }

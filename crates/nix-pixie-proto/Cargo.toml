[package]
name = "nix-pixie-proto"
description = "Wire protocol shared by the nix-pixie controller and agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hmac = "0.13.0"
postcard = { version = "1.1.3", default-features = false, features = [
  "use-std",
] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "time",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "time"] }

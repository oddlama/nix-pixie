[package]
name = "nix-pixie"
description = "Provision NixOS machines from an empty disk to a running system"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
if-addrs = "0.15"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = "0.21.7"
nix-pixie-proto = { version = "0.1.0", path = "../nix-pixie-proto" }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "time",
  "sync",
  "signal",
  "io-util",
  "process",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
